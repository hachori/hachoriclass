<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR 스캐너</title>
<link rel="canonical" href="https://hachori.github.io/hachoriclass/qr/">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --border-bright: #404040;
    --accent: #00e5a0;
    --accent-dim: rgba(0,229,160,0.12);
    --accent-dim2: rgba(0,229,160,0.06);
    --text: #e8e8e8;
    --text-muted: #888;
    --text-dim: #555;
    --danger: #ff5f5f;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'Noto Sans KR', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem 4rem;
    user-select: none;
  }

  /* header */
  header {
    width: 100%;
    max-width: 640px;
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 2.5rem;
  }
  .logo {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
    letter-spacing: .08em;
  }
  .logo-sep { color: var(--border-bright); font-family: var(--mono); font-size: 13px; }
  .logo-sub { font-family: var(--mono); font-size: 11px; color: var(--text-dim); letter-spacing: .06em; }

  /* drop zone */
  #drop-zone {
    width: 100%;
    max-width: 640px;
    border: 1.5px dashed var(--border-bright);
    border-radius: 12px;
    background: var(--surface);
    transition: border-color .2s, background .2s, transform .15s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  #drop-zone:focus { outline: 2px solid var(--accent); outline-offset: 3px; }
  #drop-zone.drag-over {
    border-color: var(--accent);
    background: var(--accent-dim2);
    transform: scale(1.01);
  }
  #drop-zone.paste-ready {
    border-color: var(--accent);
    border-style: solid;
  }

  .zone-inner {
    padding: 3rem 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    text-align: center;
  }
  .zone-icon {
    width: 52px;
    height: 52px;
    border-radius: 12px;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .2s;
  }
  #drop-zone.drag-over .zone-icon,
  #drop-zone.paste-ready .zone-icon {
    background: var(--accent-dim);
  }
  .zone-icon svg { width: 24px; height: 24px; stroke: var(--accent); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

  .zone-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.4;
  }
  .zone-hint {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.6;
  }
  .kbd {
    display: inline-block;
    background: var(--surface2);
    border: 1px solid var(--border-bright);
    border-radius: 5px;
    padding: 1px 7px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    vertical-align: middle;
  }

  /* 파일선택 링크 */
  .file-link {
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--mono);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    transition: color .15s;
  }
  .file-link:hover { color: var(--text-muted); }
  #file-input { display: none; }

  /* pulse ring when paste-ready */
  @keyframes pulse-ring {
    0%   { box-shadow: 0 0 0 0 rgba(0,229,160,0.25); }
    70%  { box-shadow: 0 0 0 10px rgba(0,229,160,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,229,160,0); }
  }
  #drop-zone.paste-ready { animation: pulse-ring 2s infinite; }

  /* preview */
  #preview-wrap {
    width: 100%;
    max-width: 640px;
    margin-top: 1.25rem;
    display: none;
  }
  #preview-wrap.visible { display: block; }
  #preview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: .6rem;
  }
  .preview-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  #clear-btn {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    transition: color .15s, background .15s;
  }
  #clear-btn:hover { color: var(--danger); background: rgba(255,95,95,.08); }

  #img-canvas-wrap {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface2);
    border: 1px solid var(--border);
    max-height: 300px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #preview-canvas {
    max-width: 100%;
    max-height: 300px;
    display: block;
  }
  /* highlight overlay rects drawn by JS */

  /* result area */
  #results {
    width: 100%;
    max-width: 640px;
    margin-top: 1rem;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    animation: slide-in .2s ease both;
  }
  @keyframes slide-in {
    from { opacity:0; transform: translateY(6px); }
    to   { opacity:1; transform: translateY(0); }
  }
  .result-card.is-url { border-color: rgba(0,229,160,.3); }

  .result-top {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: .9rem 1rem;
  }
  .result-type-badge {
    font-family: var(--mono);
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 4px;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .badge-url  { background: var(--accent-dim); color: var(--accent); }
  .badge-text { background: var(--surface2); color: var(--text-muted); }

  .result-value {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    word-break: break-all;
    line-height: 1.6;
    flex: 1;
    user-select: text;
  }

  .result-actions {
    display: flex;
    border-top: 1px solid var(--border);
    background: var(--surface2);
  }
  .action-btn {
    flex: 1;
    padding: .6rem .5rem;
    background: none;
    border: none;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    transition: background .15s, color .15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .action-btn + .action-btn { border-left: 1px solid var(--border); }
  .action-btn:hover { background: var(--accent-dim); color: var(--accent); }
  .action-btn.copied { color: var(--accent); }
  .action-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .open-btn { color: var(--accent); }
  .open-btn:hover { background: var(--accent); color: #000; }

  /* error */
  #error-msg, .gen-error {
    width: 100%;
    max-width: 640px;
    margin-top: .75rem;
    display: none;
    background: rgba(255,95,95,.08);
    border: 1px solid rgba(255,95,95,.25);
    border-radius: 8px;
    padding: .7rem 1rem;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--danger);
  }
  #error-msg.visible, .gen-error.visible { display: block; }

  /* history */
  #history-wrap {
    width: 100%;
    max-width: 640px;
    margin-top: 2.5rem;
    display: none;
  }
  #history-wrap.visible { display: block; }
  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: .75rem;
  }
  .history-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  #clear-history-btn {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    background: none;
    border: none;
    cursor: pointer;
    transition: color .15s;
  }
  #clear-history-btn:hover { color: var(--danger); }

  .history-list { display: flex; flex-direction: column; gap: 6px; }
  .history-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: .55rem .9rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: default;
    transition: border-color .15s;
  }
  .history-item:hover { border-color: var(--border-bright); }
  .history-time { font-family: var(--mono); font-size: 10px; color: var(--text-dim); flex-shrink: 0; width: 44px; }
  .history-val {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .history-badge {
    font-family: var(--mono);
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .history-item.h-url .history-badge { background: var(--accent-dim); color: var(--accent); }
  .history-item.h-text .history-badge { background: var(--surface2); color: var(--text-dim); }

  /* footer hint */
  #status-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: .5rem 1rem;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    background: var(--bg);
    border-top: 1px solid var(--border);
    pointer-events: none;
  }
  .status-dot {
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 6px;
    vertical-align: middle;
    animation: blink 2.4s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* loading spinner */
  #spinner {
    display: none;
    width: 100%;
    max-width: 640px;
    margin-top: 1rem;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
  }
  #spinner.visible { display: flex; }
  .spin-ring {
    width: 16px; height: 16px;
    border: 1.5px solid var(--border-bright);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* mode tabs */
  .tabs {
    width: 100%;
    max-width: 640px;
    display: flex;
    gap: 4px;
    padding: 4px;
    margin-bottom: 1.25rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .tab-btn {
    flex: 1;
    padding: .55rem .5rem;
    background: none;
    border: none;
    border-radius: 7px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { background: var(--accent-dim); color: var(--accent); }

  .panel { width: 100%; display: flex; flex-direction: column; align-items: center; }
  .panel[hidden] { display: none; }

  /* generator */
  .gen-box {
    width: 100%;
    max-width: 640px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .gen-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: .06em;
    text-transform: uppercase;
    margin-bottom: .4rem;
    display: block;
  }
  #gen-input {
    width: 100%;
    min-height: 90px;
    resize: vertical;
    background: var(--surface2);
    border: 1px solid var(--border-bright);
    border-radius: 8px;
    padding: .7rem .8rem;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
    user-select: text;
  }
  #gen-input:focus { outline: none; border-color: var(--accent); }
  #gen-input::placeholder { color: var(--text-dim); }
  .gen-meta {
    display: flex;
    justify-content: flex-end;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    margin-top: .3rem;
  }
  .gen-opts { display: flex; gap: 10px; flex-wrap: wrap; }
  .gen-opt { flex: 1; min-width: 140px; }
  .gen-opt select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border-bright);
    border-radius: 8px;
    padding: .5rem .6rem;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    cursor: pointer;
  }
  .gen-opt select:focus { outline: none; border-color: var(--accent); }

  #gen-output {
    width: 100%;
    max-width: 640px;
    margin-top: 1rem;
    background: var(--surface);
    border: 1px solid rgba(0,229,160,.3);
    border-radius: 10px;
    overflow: hidden;
    animation: slide-in .2s ease both;
  }
  #gen-output[hidden] { display: none; }
  .gen-canvas-wrap {
    padding: 1.25rem;
    display: flex;
    justify-content: center;
    background: var(--surface2);
  }
  #gen-canvas {
    display: block;
    width: 240px;
    max-width: 100%;
    height: auto;
    border-radius: 6px;
    image-rendering: pixelated;
  }
  #gen-output .result-actions { border-top: 1px solid var(--border); }
</style>
</head>
<body>

<header>
  <span class="logo">QR.SCAN</span>
  <span class="logo-sep">/</span>
  <span class="logo-sub">scan · make</span>
</header>

<!-- Mode tabs -->
<div class="tabs" role="tablist">
  <button class="tab-btn active" role="tab" data-mode="scan" aria-selected="true">QR 스캔</button>
  <button class="tab-btn" role="tab" data-mode="make" aria-selected="false">QR 생성</button>
</div>

<!-- ═══ Scan panel ═══ -->
<div class="panel" id="panel-scan">

<!-- Drop / Paste Zone -->
<div id="drop-zone" tabindex="0" role="button" aria-label="QR 이미지 붙여넣기 또는 드래그">
  <div class="zone-inner">
    <div class="zone-icon">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="3" height="3"/><rect x="19" y="14" width="2" height="2"/><rect x="14" y="19" width="2" height="2"/><rect x="19" y="19" width="2" height="2"/></svg>
    </div>
    <div class="zone-title">
      <kbd class="kbd">Ctrl</kbd> + <kbd class="kbd">V</kbd> 로 붙여넣기
    </div>
    <div class="zone-hint">
      캡처한 QR 이미지를 클립보드에서 바로 붙여넣으세요<br>
      또는 이미지 파일을 여기 드래그하거나 →
      <span class="file-link" id="file-link-btn">파일 선택</span>
    </div>
  </div>
</div>
<input type="file" id="file-input" accept="image/*">

<!-- Spinner -->
<div id="spinner"><div class="spin-ring"></div> 디코딩 중...</div>

<!-- Error -->
<div id="error-msg"></div>

<!-- Preview -->
<div id="preview-wrap">
  <div id="preview-header">
    <span class="preview-label">이미지 미리보기</span>
    <button id="clear-btn">✕ 초기화</button>
  </div>
  <div id="img-canvas-wrap">
    <canvas id="preview-canvas"></canvas>
  </div>
</div>

<!-- Results -->
<div id="results"></div>

<!-- History -->
<div id="history-wrap">
  <div class="history-header">
    <span class="history-label">이번 세션 기록</span>
    <button id="clear-history-btn">전체 삭제</button>
  </div>
  <div class="history-list" id="history-list"></div>
</div>

</div><!-- /panel-scan -->

<!-- ═══ Make panel ═══ -->
<div class="panel" id="panel-make" hidden>
  <div class="gen-box">
    <div>
      <label class="gen-label" for="gen-input">QR에 담을 내용</label>
      <textarea id="gen-input" placeholder="링크(https://...)나 텍스트를 입력하세요" spellcheck="false"></textarea>
      <div class="gen-meta"><span id="gen-count">0자</span></div>
    </div>
    <div class="gen-opts">
      <div class="gen-opt">
        <label class="gen-label" for="gen-size">크기</label>
        <select id="gen-size">
          <option value="256">작게 (256px)</option>
          <option value="512" selected>보통 (512px)</option>
          <option value="1024">크게 (1024px · 인쇄용)</option>
        </select>
      </div>
      <div class="gen-opt">
        <label class="gen-label" for="gen-ecc">오류 복원</label>
        <select id="gen-ecc">
          <option value="L">낮음 (L · 촘촘함 ↓)</option>
          <option value="M" selected>보통 (M)</option>
          <option value="Q">높음 (Q)</option>
          <option value="H">최고 (H · 훼손에 강함)</option>
        </select>
      </div>
    </div>
  </div>

  <div id="gen-error" class="gen-error"></div>

  <div id="gen-output" hidden>
    <div class="gen-canvas-wrap"><canvas id="gen-canvas"></canvas></div>
    <div class="result-actions">
      <button class="action-btn" id="gen-copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>이미지 복사</button>
      <button class="action-btn open-btn" id="gen-download"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>PNG 저장</button>
    </div>
  </div>
</div><!-- /panel-make -->

<!-- Status bar -->
<div id="status-bar">
  <span class="status-dot"></span>
  <span id="status-text">클립보드 붙여넣기 대기 중 — 어디서든 Ctrl+V 하면 인식합니다</span>
</div>

<!-- jsQR (스캔) / qrcode-generator (생성) -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
const dropZone   = document.getElementById('drop-zone');
const fileInput  = document.getElementById('file-input');
const fileLinkBtn= document.getElementById('file-link-btn');
const previewWrap= document.getElementById('preview-wrap');
const previewCanvas=document.getElementById('preview-canvas');
const spinner    = document.getElementById('spinner');
const errorMsg   = document.getElementById('error-msg');
const resultsDiv = document.getElementById('results');
const historyWrap= document.getElementById('history-wrap');
const historyList= document.getElementById('history-list');
const clearBtn   = document.getElementById('clear-btn');
const clearHistBtn=document.getElementById('clear-history-btn');

let sessionHistory = [];

// ── helpers ──────────────────────────────────────────────────
function isURL(s) {
  try { const u = new URL(s); return u.protocol === 'http:' || u.protocol === 'https:'; }
  catch { return false; }
}

function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.classList.add('visible');
  setTimeout(() => errorMsg.classList.remove('visible'), 4000);
}

function hideError() { errorMsg.classList.remove('visible'); }

function setSpinner(on) {
  spinner.classList.toggle('visible', on);
}

// jsQR 1.4.0은 inversionAttempts:'onlyInvert' 단독 호출 시 항상 예외를 던지므로 'attemptBoth'만 쓴다.
// 인식이 안 되면 흰 여백(quiet zone)을 붙이고 해상도를 줄여가며 재시도한다.
function scanCanvas(src) {
  const PAD = 32;
  for (const s of [1, 0.6, 0.35]) {
    const w = Math.round(src.width * s), h = Math.round(src.height * s);
    if (w < 40 || h < 40) break;
    const c = document.createElement('canvas');
    c.width = w + PAD * 2;
    c.height = h + PAD * 2;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.fillStyle = '#fff';
    g.fillRect(0, 0, c.width, c.height);
    g.drawImage(src, PAD, PAD, w, h);
    const d = g.getImageData(0, 0, c.width, c.height);
    const code = jsQR(d.data, d.width, d.height, { inversionAttempts: 'attemptBoth' });
    if (code) {
      // 확대/여백을 되돌려 원본 이미지 좌표로 변환
      const back = p => ({ x: (p.x - PAD) / s, y: (p.y - PAD) / s });
      const l = code.location;
      return {
        data: code.data,
        location: {
          topLeftCorner: back(l.topLeftCorner),
          topRightCorner: back(l.topRightCorner),
          bottomRightCorner: back(l.bottomRightCorner),
          bottomLeftCorner: back(l.bottomLeftCorner)
        }
      };
    }
  }
  return null;
}

// ── decode image ──────────────────────────────────────────────
function decodeImage(imgSrc) {
  hideError();
  setSpinner(true);
  resultsDiv.innerHTML = '';

  const img = new Image();
  img.onload = () => {
    try {
      // 투명 PNG는 흰 배경 위에 그린다. (jsQR은 알파를 무시해서 투명 픽셀을 검정으로 읽는다)
      const W = img.naturalWidth, H = img.naturalHeight;
      const ctx = previewCanvas.getContext('2d', { willReadFrequently: true });
      previewCanvas.width  = W;
      previewCanvas.height = H;
      previewCanvas.style.maxWidth  = '100%';
      previewCanvas.style.maxHeight = '300px';
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, W, H);
      ctx.drawImage(img, 0, 0);
      previewWrap.classList.add('visible');

      const code = scanCanvas(previewCanvas);
      if (!code) {
        showError('QR 코드를 찾을 수 없습니다. 이미지를 더 크게 캡처하거나, 다른 이미지를 붙여넣어 보세요.');
        return;
      }

      // draw highlight box
      const loc = code.location;
      ctx.beginPath();
      ctx.moveTo(loc.topLeftCorner.x,     loc.topLeftCorner.y);
      ctx.lineTo(loc.topRightCorner.x,    loc.topRightCorner.y);
      ctx.lineTo(loc.bottomRightCorner.x, loc.bottomRightCorner.y);
      ctx.lineTo(loc.bottomLeftCorner.x,  loc.bottomLeftCorner.y);
      ctx.closePath();
      ctx.lineWidth   = Math.max(3, W * 0.004);
      ctx.strokeStyle = '#00e5a0';
      ctx.stroke();
      ctx.fillStyle = 'rgba(0,229,160,0.12)';
      ctx.fill();

      renderResult(code.data);
    } catch (e) {
      showError('디코딩 중 오류가 발생했습니다: ' + e.message);
    } finally {
      setSpinner(false);   // 어떤 경우에도 스피너가 남지 않게 한다
    }
  };
  img.onerror = () => { setSpinner(false); showError('이미지를 불러올 수 없습니다.'); };
  img.src = imgSrc;
}

// ── render result card ────────────────────────────────────────
function renderResult(data) {
  const url = isURL(data);
  const card = document.createElement('div');
  card.className = 'result-card' + (url ? ' is-url' : '');

  const badge = url ? '<span class="result-type-badge badge-url">URL</span>'
                    : '<span class="result-type-badge badge-text">TEXT</span>';

  const copyIcon = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  const openIcon = '<svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  // QR 내용은 속성/인라인 JS에 넣지 않고 클로저로만 전달한다 (악성 QR을 통한 스크립트 주입 방지)
  const actions = `<button class="action-btn" data-act="copy">${copyIcon}${url ? '복사' : '클립보드에 복사'}</button>`
    + (url ? `<button class="action-btn open-btn" data-act="open">${openIcon}링크 열기</button>` : '');

  card.innerHTML = `
    <div class="result-top">
      ${badge}
      <div class="result-value">${escHTML(data)}</div>
    </div>
    <div class="result-actions">${actions}</div>`;

  card.querySelector('[data-act="copy"]').addEventListener('click', e => copyText(e.currentTarget, data));
  const openBtn = card.querySelector('[data-act="open"]');
  if (openBtn) openBtn.addEventListener('click', () => openURL(data));

  resultsDiv.appendChild(card);

  // auto-open URL on first decode
  if (url && resultsDiv.children.length === 1) {
    // short delay so user sees the card first
    setTimeout(() => { /* don't auto-open; user decides */ }, 100);
  }

  addHistory(data, url);
}

function escHTML(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── history ───────────────────────────────────────────────────
function addHistory(data, url) {
  const now = new Date();
  const t = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  sessionHistory.unshift({ data, url, t });
  renderHistory();
  historyWrap.classList.add('visible');
}

function renderHistory() {
  historyList.innerHTML = '';
  sessionHistory.forEach(item => {
    const div = document.createElement('div');
    div.className = 'history-item ' + (item.url ? 'h-url' : 'h-text');
    div.innerHTML = `<span class="history-time">${item.t}</span>
      <span class="history-val">${escHTML(item.data)}</span>
      <span class="history-badge">${item.url ? 'URL' : 'TXT'}</span>`;
    historyList.appendChild(div);
  });
}

// ── actions ───────────────────────────────────────────────────
window.copyText = function(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.innerHTML;
    btn.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>복사됨';
    btn.classList.add('copied');
    setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copied'); }, 1500);
  });
};
window.openURL = function(url) {
  window.open(url, '_blank', 'noopener,noreferrer');
};

// ── process blob/file ─────────────────────────────────────────
function processBlob(blob) {
  const reader = new FileReader();
  reader.onload = e => decodeImage(e.target.result);
  reader.readAsDataURL(blob);
}

function clearAll() {
  previewWrap.classList.remove('visible');
  resultsDiv.innerHTML = '';
  hideError();
  const ctx = previewCanvas.getContext('2d');
  ctx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
}

// ── Clipboard paste (Ctrl+V anywhere) ────────────────────────
document.addEventListener('paste', e => {
  const items = (e.clipboardData || e.originalEvent?.clipboardData)?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      setMode('scan');   // 생성 탭에서 이미지를 붙여넣어도 바로 스캔한다
      clearAll();
      processBlob(item.getAsFile());
      return;
    }
  }
  // 입력칸에 텍스트를 붙여넣는 건 정상 동작이므로 건드리지 않는다
  if (e.target.closest('textarea, input') || currentMode === 'make') return;
  showError('클립보드에 이미지가 없습니다. 스크린샷이나 QR 이미지를 먼저 복사하세요.');
});

// ── Drag & Drop ───────────────────────────────────────────────
['dragenter','dragover'].forEach(ev => {
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
});
['dragleave','dragend'].forEach(ev => {
  dropZone.addEventListener(ev, () => dropZone.classList.remove('drag-over'));
});
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const file = e.dataTransfer?.files[0];
  if (file && file.type.startsWith('image/')) { clearAll(); processBlob(file); }
  else showError('이미지 파일만 지원합니다.');
});

// ── File select ───────────────────────────────────────────────
fileLinkBtn.addEventListener('click', e => { e.stopPropagation(); fileInput.click(); });
fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (file) { clearAll(); processBlob(file); fileInput.value = ''; }
});

// ── Clear ─────────────────────────────────────────────────────
clearBtn.addEventListener('click', clearAll);
clearHistBtn.addEventListener('click', () => {
  sessionHistory = [];
  historyList.innerHTML = '';
  historyWrap.classList.remove('visible');
});

// ── Keyboard: Enter/Space on dropzone ────────────────────────
dropZone.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
});

// ── Paste-ready pulse on focus ────────────────────────────────
window.addEventListener('focus', () => dropZone.classList.add('paste-ready'));
window.addEventListener('blur',  () => dropZone.classList.remove('paste-ready'));
dropZone.classList.add('paste-ready');

// ── Mode tabs (scan / make) ──────────────────────────────────
const tabBtns    = document.querySelectorAll('.tab-btn');
const panelScan  = document.getElementById('panel-scan');
const panelMake  = document.getElementById('panel-make');
const statusText = document.getElementById('status-text');
let currentMode  = 'scan';

function setMode(mode) {
  currentMode = mode;
  tabBtns.forEach(b => {
    const on = b.dataset.mode === mode;
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', on);
  });
  panelScan.hidden = mode !== 'scan';
  panelMake.hidden = mode !== 'make';
  statusText.textContent = mode === 'scan'
    ? '클립보드 붙여넣기 대기 중 — 어디서든 Ctrl+V 하면 인식합니다'
    : '입력하는 즉시 QR 코드가 만들어집니다';
  // #make 로 공유하면 생성 탭이 바로 열린다
  history.replaceState(null, '', mode === 'make' ? '#make' : location.pathname + location.search);
  if (mode === 'make') genInput.focus();
}
tabBtns.forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

// ── QR generator ─────────────────────────────────────────────
const genInput    = document.getElementById('gen-input');
const genCount    = document.getElementById('gen-count');
const genSize     = document.getElementById('gen-size');
const genEcc      = document.getElementById('gen-ecc');
const genError    = document.getElementById('gen-error');
const genOutput   = document.getElementById('gen-output');
const genCanvas   = document.getElementById('gen-canvas');
const genCopyBtn  = document.getElementById('gen-copy');
const genDownBtn  = document.getElementById('gen-download');

// 한글 등 비ASCII 문자도 깨지지 않도록 UTF-8로 인코딩
qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];

function renderQR() {
  const text = genInput.value;
  genCount.textContent = text.length + '자';
  genError.classList.remove('visible');
  if (!text.trim()) { genOutput.hidden = true; return; }

  let qr;
  try {
    qr = qrcode(0, genEcc.value);   // 0 = 내용 길이에 맞춰 버전 자동 선택
    qr.addData(text, 'Byte');
    qr.make();
  } catch {
    genError.textContent = '내용이 너무 깁니다. 글자 수를 줄이거나 오류 복원 단계를 낮춰 보세요.';
    genError.classList.add('visible');
    genOutput.hidden = true;
    return;
  }

  // 모듈 하나를 정수 픽셀로 그려야 경계가 흐려지지 않는다 (여백 4칸은 QR 표준)
  const n = qr.getModuleCount(), QUIET = 4;
  const cell = Math.max(1, Math.floor(+genSize.value / (n + QUIET * 2)));
  const px = cell * (n + QUIET * 2);
  genCanvas.width = genCanvas.height = px;
  const g = genCanvas.getContext('2d');
  g.fillStyle = '#fff';
  g.fillRect(0, 0, px, px);
  g.fillStyle = '#000';
  for (let r = 0; r < n; r++)
    for (let c = 0; c < n; c++)
      if (qr.isDark(r, c)) g.fillRect((c + QUIET) * cell, (r + QUIET) * cell, cell, cell);
  genOutput.hidden = false;
}

[genInput, genSize, genEcc].forEach(el => el.addEventListener('input', renderQR));

function flashBtn(btn, label) {
  const orig = btn.innerHTML;
  btn.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>' + label;
  btn.classList.add('copied');
  setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copied'); }, 1500);
}

genCopyBtn.addEventListener('click', () => {
  genCanvas.toBlob(blob => {
    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
      .then(() => flashBtn(genCopyBtn, '복사됨'))
      .catch(() => {
        genError.textContent = '이 브라우저에서는 이미지 복사가 지원되지 않습니다. PNG 저장을 이용하세요.';
        genError.classList.add('visible');
      });
  }, 'image/png');
});

genDownBtn.addEventListener('click', () => {
  genCanvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'qr.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    flashBtn(genDownBtn, '저장됨');
  }, 'image/png');
});

if (location.hash === '#make') setMode('make');
</script>
